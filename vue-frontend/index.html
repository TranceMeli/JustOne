<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/day-square.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JustOne</title>
    <script>
      // Set the theme before the first paint so dark mode doesn't flash light (see useTheme.js).
      try {
        var mode = localStorage.getItem('theme')
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
